name: Atualizar dados Transferegov

on:
  schedule:
    - cron: '0 9,12,15,19 * * *'   # 06:00, 09:00, 12:00 e 16:00 (Brasília): os relatórios do Tesouro chegam por e-mail ao longo da manhã
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recuperar o histórico das obras (dia anterior)
        run: curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/dados/historico_obras.csv" -o /tmp/historico_obras.csv || echo "sem histórico anterior"

      - name: Baixar e filtrar os dados da SDR
        run: python scripts/processar.py saida
        env:
          HIST_ANTERIOR: /tmp/historico_obras.csv

      - name: Proteção · download do Transferegov falhou? mantém os dados da rodada anterior
        run: python scripts/manter_anterior.py saida

      - name: Base Celebração (Planilha Execução Parcerias SDR · UG 420013)
        continue-on-error: true
        run: python scripts/celebracao.py saida

      - name: TEDs (API pública de TED)
        continue-on-error: true
        run: python scripts/ted.py saida

      - name: TEDs · relatório do Tesouro Gerencial (abas publicadas da BASE TED)
        continue-on-error: true
        run: python scripts/ted_tesouro.py saida

      - name: TEDs · cadastro único (quais TEDs existem · Tesouro + NC + PF + API + controle)
        continue-on-error: true
        run: python scripts/ted_cadastro.py saida

      - name: Orçamento por ação (aba ORCAMENTO da BASE ORÇAMENTO SDR)
        continue-on-error: true
        run: python scripts/orcamento.py saida

      - name: Contratos.gov.br (API pública · 1x por dia, nas outras rodadas reaproveita)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p /tmp/ctr_ant
          for k in ctr emp fat his res arq itn ith cro pag oco gar; do curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/dados/contratos_api_$k.csv" -o /tmp/ctr_ant/contratos_api_$k.csv || true; done
          mkdir -p saida
          # deixa a leitura anterior já no lugar: se este passo for interrompido, o painel não fica sem contratos
          for f in /tmp/ctr_ant/contratos_api_*.csv; do if [ -s "$f" ]; then cp "$f" saida/; fi; done
          python scripts/contratos_api.py saida 2>&1 | tee saida/log_contratos.txt
        env:
          CONTRATOS_ANTERIOR: /tmp/ctr_ant

      - name: Painel de Execução · cadastro automático dos vigentes (contratos, parcerias, TED)
        continue-on-error: true
        run: python scripts/execucao_cadastro.py saida

      - name: Indicadores do IDTRU-DL (visão do repassador · 5 UGs da SDR)
        continue-on-error: true
        run: python scripts/indicadores.py saida

      - name: Relatório do instrumento (um arquivo por grupo de instrumentos + índice da busca)
        continue-on-error: true
        run: python scripts/relatorio.py saida

      - name: Banco de perguntas do assistente (dados com gabarito + base de 420 + perguntas reais)
        continue-on-error: true
        run: python scripts/assistente_banco.py saida

      - name: Captação de Emendas · Emenda Individual (extrator do SIOP × Transferegov)
        continue-on-error: true
        run: python scripts/emendas_siop.py saida

      - name: Gerar as páginas do painel (Propostas, Empenho, Programas, Movimentação, Obras, Prestação de contas)
        run: python scripts/paginas.py saida

      - name: TEDs · varredura de consistência (duplicidades e dados de um TED em outro)
        continue-on-error: true
        run: python scripts/ted_varredura.py saida

      - name: Alertas por menu (Parcerias e TED · depois das páginas, que geram a base do TED)
        continue-on-error: true
        run: python scripts/alertas.py saida

      - name: Alertas · histórico (novos, resolvidos e como saíram · compara com a última foto do dia anterior)
        continue-on-error: true
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/dados/alertas_hist.json" -o /tmp/alertas_hist.json || echo "sem histórico anterior"
          python scripts/alertas_hist.py saida
        env:
          HIST_ALERTAS: /tmp/alertas_hist.json

      - name: Comunicados do MGI/Transferegov e da CMO + prazos dos cronogramas de emendas (Calendário de parcerias)
        continue-on-error: true
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/dados/comunicados/comunicados.json" -o /tmp/comunicados_ant.json || echo "sem rodada anterior"
          python scripts/comunicados.py saida || true
          python - <<'PY'
          import json, os, shutil
          novo, ant = 'saida/comunicados/comunicados.json', '/tmp/comunicados_ant.json'
          try: n = len(json.load(open(novo, encoding='utf-8')).get('comunicados', []))
          except Exception: n = 0
          if n == 0 and os.path.exists(ant) and os.path.getsize(ant) > 50:
              os.makedirs('saida/comunicados', exist_ok=True); shutil.copy(ant, novo); print('comunicados: leitura falhou, mantida a rodada anterior')
          PY

      - name: Viagens a serviço (diárias e passagens · SCDP) das UGs SDR · Portal da Transparência
        continue-on-error: true
        run: |
          ANO=$(date +%Y)
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/dados/viagens/gastos_${ANO}.json" -o /tmp/gastos_ant.json || echo "sem gastos anteriores (lê o ano todo)"
          python scripts/viagens.py saida /tmp/gastos_ant.json || true
          if [ ! -s "saida/viagens/gastos_${ANO}.json" ] && [ -s /tmp/gastos_ant.json ]; then mkdir -p saida/viagens; cp /tmp/gastos_ant.json "saida/viagens/gastos_${ANO}.json"; echo "gastos: mantida a leitura anterior"; fi
          if [ ! -s "saida/viagens/viagens_${ANO}.json" ]; then
            mkdir -p saida/viagens
            curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/dados/viagens/viagens_${ANO}.json" -o "saida/viagens/viagens_${ANO}.json" && echo "viagens: Portal falhou, mantida a rodada anterior" || rm -f "saida/viagens/viagens_${ANO}.json"
          fi

      - name: Data de atualização de cada base (só muda quando o conteúdo muda)
        continue-on-error: true
        run: python scripts/datas_bases.py saida

      - name: Comprimir os arquivos grandes que só o robô usa (.csv → .csv.gz)
        run: |
          python - <<'PY'
          import gzip, os, shutil
          # ficam como .csv (lidos de fora: painel, Apps Script das planilhas ou a rodada seguinte do robô)
          FICA = {'planilha_parcerias.csv', 'planilha_propostas.csv', 'painel_instrumentos.csv', 'painel_empenhos.csv', 'painel_obras.csv',
                  'historico_obras.csv', 'instrumentos_outros_orgaos.csv'}
          for raiz, _, arqs in os.walk('saida'):
              for a in arqs:
                  c = os.path.join(raiz, a)
                  if not a.endswith('.csv') or a in FICA or a.startswith('contratos_api_') or '/ted' in raiz or os.path.getsize(c) < 8 * 1048576:
                      continue
                  with open(c, 'rb') as fi, gzip.open(c + '.gz', 'wb', compresslevel=9) as fo:
                      shutil.copyfileobj(fi, fo)
                  print(f'{c}: {os.path.getsize(c)/1048576:.1f} MB -> {os.path.getsize(c + ".gz")/1048576:.1f} MB')
                  os.remove(c)
          PY

      - name: LGPD · mascarar o CPF de pessoas físicas em tudo o que vai ser publicado
        run: python scripts/lgpd.py saida

      - name: Publicar na branch "dados"
        run: |
          cd saida
          date -u '+%Y%m%d%H%M%S' > versao.txt
          for f in *; do echo "::notice title=$f::$(du -h "$f" | cut -f1)"; done
          git init -q
          git checkout -q -b dados
          git config user.name  "robo-transferegov"
          git config user.email "robo-transferegov@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados do Transferegov · $(date -u -d '-3 hours' '+%d/%m/%Y %H:%M')"
          if ! saida_push=$(git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dados 2>&1); then
            echo "::error title=Falha ao publicar::$(echo "$saida_push" | tr '\n' ' ' | sed "s/${GH_TOKEN}/***/g" | tail -c 900)"
            exit 1
          fi
          echo "::notice title=Publicado::https://github.com/${{ github.repository }}/tree/dados"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
