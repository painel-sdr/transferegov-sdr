<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orçamento por ação</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">__CSS__
<style>
.cred-k{cursor:pointer;transition:box-shadow .12s}.cred-k:hover{box-shadow:0 6px 18px rgba(183,134,11,.35)}
.k.gr{border-left:5px solid var(--b);cursor:pointer}.k.gr.sel{box-shadow:0 0 0 3px var(--b)}.k.gr b{font-size:24px}.gr-l{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:12px;color:#66727c}.gr-l em{display:block;font-style:normal;font-weight:700;color:#1d2b24;font-size:13px}.gr-b{display:block;height:7px;border-radius:5px;background:#e3ebe5;margin-top:8px;overflow:hidden}.gr-b i{display:block;height:100%}
.gr-ac{display:block;font-weight:500;font-size:11.5px;color:#4c5c53;margin-top:2px}
.grp{font-size:12px;font-weight:700;color:#1f4e79;text-transform:uppercase;letter-spacing:.6px;margin:2px 0 6px 2px}
.kp.k4{grid-template-columns:repeat(4,1fr)}@media(max-width:900px){.kp.k4{grid-template-columns:1fr 1fr}}.kp.k5{grid-template-columns:repeat(5,1fr)}@media(max-width:1100px){.kp.k5{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.kp.k5{grid-template-columns:1fr 1fr}}
.k.amar b{color:#b7860b}.k.verde b{color:#2e8a57}.k.red b{color:#c0392b}
.hb{grid-template-columns:minmax(150px,40%) 1fr 78px 44px}.hb .hbr{white-space:normal;line-height:1.2;font-size:12.5px}
.ot{width:100%;border-collapse:collapse;font-size:12.5px}.ot th{background:#1f4e79;color:#fff;padding:7px 8px;text-align:right;font-weight:600;white-space:nowrap}.ot th:first-child{text-align:left}
.ot td{padding:6px 8px;border-bottom:1px solid #eef2f5;text-align:right;white-space:nowrap}.ot td:first-child{text-align:left;white-space:normal}
.ot tr.ac td{background:#e3edf7;font-weight:700;border-top:2px solid #b9c7d3}.ot tr.po{cursor:pointer}.ot tr.po:hover td{background:#f5f8fb}.ot tr.po.aberto td{background:#fff8e1}
.ot tr.ug td{background:#fbfcfd;font-size:11.5px;color:#3a4a55}.ot tr.ug td:first-child{padding-left:26px}
.ot .neg{color:#c0392b}.ot .pos{color:#2e8a57}.ot .bloq{color:#c0392b;font-weight:700}.ot small{display:block;color:#7b8790;font-weight:400;font-size:11px}
.esc{font-size:13px;color:#3a4a55;margin-left:14px;cursor:pointer}.esc input{vertical-align:middle}
.rolar{overflow:auto}
.bf{border:0;background:#1f4e79;color:#fff;border-radius:6px;padding:2px 8px;font:600 11px Barlow,sans-serif;cursor:pointer;margin-left:6px;vertical-align:middle}
#fundoF{position:fixed;inset:0;background:rgba(20,30,40,.55);z-index:9999;overflow:auto;padding:24px 12px}#fundoF[hidden]{display:none}
.fo{max-width:980px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);overflow:hidden;font-family:Barlow,sans-serif}
.fo .cab{background:linear-gradient(120deg,#163e63,#2a6aa3);color:#fff;padding:16px 20px;position:relative}.fo .cab small{opacity:.85;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.fo .cab h2{margin:2px 0 6px;font-size:22px;padding-right:150px}.fo .pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;margin:2px 4px 2px 0;background:rgba(255,255,255,.2)}.fo .pill.vm{background:#c0392b}
.fo .acoes{position:absolute;right:16px;top:14px;display:flex;gap:6px}.fo .acoes button{border:0;border-radius:8px;padding:6px 10px;background:rgba(255,255,255,.2);color:#fff;font:600 12px Barlow;cursor:pointer}
.fo .corpo{padding:14px 20px 20px}.fo h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#1f4e79;border-bottom:2px solid #e3e8ee;padding-bottom:4px;margin:16px 0 8px}
.fl{display:grid;grid-template-columns:170px 1fr 110px 50px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:5px}.fl i{display:block;height:15px;border-radius:4px}.fl b{text-align:right}.fl small{color:#7b8790;text-align:right}
@media(max-width:700px){.fl{grid-template-columns:105px 1fr 90px}.fl small{display:none}.fo .cab h2{padding-right:0}.fo .acoes{position:static;margin-top:8px}}
@media print{body>*:not(#fundoF){display:none!important}#fundoF{position:static;background:none;padding:0}.fo .acoes{display:none}}
</style></head><body>
<div class="wrap">
<div class="nota" id="nota"></div>
<section class="card"><div class="filtros" id="filtros"></div><button class="btn" id="limpar">Limpar filtros</button> <button class="btn" id="impPag" type="button" title="Abre a página numa aba própria para salvar em PDF">📄 Extração em PDF</button>
 <label class="esc"><input type="checkbox" id="todas"> mostrar todas as ações do MAPA</label>
 <span id="contagem" style="font-size:13px;color:#66727c;margin-left:12px"></span></section>
<div id="corpo"></div>
<section class="card"><h3>Orçamento por ação e plano orçamentário</h3><p class="d">clique em <b>ficha</b> para abrir a ficha da ação · clique no PO para ver como o crédito foi distribuído entre as UGs</p><div class="rolar" id="tabela"></div></section>
</div>
<div id="fundoF" hidden></div>
<script>
const P = __DADOS__, R = P.linhas;
// ações e POs acompanhados (memória da SDR): null = todos os POs da ação
const ESCOPO = {'20ZV':null,'20ZY':null,'2000':['000H','000K'],'215A':null,'8593':null,'214Z':null,'00PN':['0003'],'8622':null,'21B6':null,'8606':['0001']};
const UGN = {'130101':'130101 · CGOF/MAPA (setorial)','130010':'130010 · CEPLAC','130141':'130141 · CGPI/SDR','130255':'130255 · CGMAP/SDR','135098':'135098 · Caixa/MA','420013':'420013 · SDR'};
const GNDN = {'1':'Pessoal','2':'Juros','3':'Outras despesas correntes','4':'Investimentos','5':'Inversões financeiras','6':'Amortização'};
const M = ['ini','sup','canc','atu','indisp','provConc','provRec','destConc','disp','emp','liq','pago'];
const D = R.map(r => { const o = {ug:r[0], acao:r[1], acaoN:r[1]+' · '+r[2], po:r[3], poN:r[3]+' · '+r[4], ptres:r[5], gnd:'GND '+r[6]+(GNDN[r[6]]?' · '+GNDN[r[6]]:''), gndC:r[6], rp:'RP '+r[7]};
  M.forEach((k,i) => o[k] = r[8+i]||0); o.ugN = UGN[o.ug] || o.ug; if(/^\d{1,3}$/.test(o.po)) o.po = o.po.padStart(4,'0'); if(/^\d{1,3}$/.test(o.acao)) o.acao = o.acao.padStart(4,'0'); o.noEscopo = o.acao in ESCOPO && (!ESCOPO[o.acao] || ESCOPO[o.acao].includes(o.po)); return o; });
const FIL = [['acaoN','Ação'],['poN','Plano orçamentário'],['ptres','PTRES'],['gnd','Grupo de despesa (GND)'],['rp','Resultado primário'],['ugN','UG']];
const SEL = {};
function base(){ return document.getElementById('todas').checked ? D : D.filter(o => o.noEscopo); }
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm = v => window.__FM_EXATO ? '§'+(+v||0) : fm0_(v), fm0_ = v => { const a = Math.abs(v||0), s = v<0?'−':''; return s+(a>=1e9 ? (a/1e9).toFixed(2).replace('.',',')+' Bi' : a>=1e6 ? (a/1e6).toFixed(2).replace('.',',')+' Mi' : (a/1e3).toFixed(1).replace('.',',')+' Mil'); };
const f2 = v => Math.abs(v||0) < 0.005 ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const R$ = v => window.__FM_EXATO ? '§'+(+v||0) : R0_(v), R0_ = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
// valor resumido (Mi/Mil) com o valor completo ao passar o mouse
const ft = v => `<abbr title="${R$(v)}" style="cursor:help;text-decoration:none;font:inherit;color:inherit">${fm(v)}</abbr>`;
const pct = (a,b) => b ? Math.round(a/b*100)+'%' : '—';
const n = x => Number(x||0).toLocaleString('pt-BR');
const soma = (L,k) => L.reduce((a,o) => a+(o[k]||0), 0);
function filtrar(exceto){ return base().filter(o => FIL.every(([k]) => k===exceto || !SEL[k] || String(o[k])===SEL[k])); }
function desenharFiltros(){}
function hbar(lista, campo, cor, fmt, tot){
  const mx = Math.max(1,...lista.map(x => Math.abs(x[1])));
  return lista.map(([k,v]) => `<div class="hb ${ehSel(campo,k)?'sel':''}" data-k="${campo}" data-v="${esc(k)}" title="${esc(k)}: ${R$(v)}"><span class="hbr">${esc(k)}</span><div><i style="width:${Math.abs(v)/mx*100}%;background:${cor}"></i></div><b>${fmt(v)}</b><em>${tot!==undefined?tot(k):''}</em></div>`).join('') || '<p class="d">nada neste recorte</p>';
}
// detalhe do crédito disponível: onde está o saldo (UG · ação · PO · PTRES · GND · RP)
function credDetalhe(L){
  const m = new Map();
  L.forEach(o => { if(Math.abs(o.disp||0) < 0.01) return; const k = [o.ugN, o.acaoN, o.poN || o.po, o.ptres, o.gnd, o.rp].join('|'); m.set(k, (m.get(k)||0) + o.disp); });
  const lin = [...m].map(([k,v]) => k.split('|').concat([v])).filter(x => Math.abs(x[6]) > 1).sort((a,b) => b[6]-a[6]);
  const tot = lin.reduce((a,x) => a + x[6], 0);
  return `<section class="card" style="border:2px solid #b7860b"><h3>Onde está o crédito disponível</h3><p class="d">${n(lin.length)} linha(s) · setorial (130101) = ainda não provisionado; demais UGs = provisionado e ainda sem empenho · clique de novo no cartão para fechar</p>
    <div style="overflow:auto;max-height:420px"><table class="mini" style="font-size:12.5px"><thead><tr><th>UG</th><th>Ação</th><th>Plano orçamentário</th><th>PTRES</th><th>GND</th><th>RP</th><th style="text-align:right">Crédito disponível</th></tr></thead><tbody>
    ${lin.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td><td>${esc(x[4])}</td><td>${esc(x[5])}</td><td style="text-align:right;white-space:nowrap">${R$(x[6])}</td></tr>`).join('') || '<tr><td colspan="7">Sem crédito disponível no recorte.</td></tr>'}
    </tbody><tfoot><tr><td colspan="6"><b>Total</b></td><td style="text-align:right;white-space:nowrap"><b>${R$(tot)}</b></td></tr></tfoot></table></div></section>`;
}
document.addEventListener('click', e => { if(e.target.closest('.cred-k')){ e.stopImmediatePropagation(); window.__cred = !window.__cred; render(); } }, true);
const agr = (L, k) => { const m = new Map(); L.forEach(o => { const x = m.get(o[k]) || m.set(o[k], {}).get(o[k]); M.forEach(c => x[c] = (x[c]||0) + o[c]); }); return m; };
const kpi = (rot, val, sub, cls) => `<div class="k ${cls||''}"><span>${rot}</span><b>${val}</b><small>${sub||''}</small></div>`;
const ABERTO = new Set();
// GND e resultado primário (discricionário × emendas) sempre à vista · acompanham os outros filtros (ação, PO, UG…) — 03/11/2026
const RPN = {'RP 0':'Financeiro','RP 1':'Obrigatório','RP 2':'Discricionário','RP 3':'PAC','RP 6':'Emenda individual','RP 7':'Emenda de bancada','RP 8':'Emenda de comissão','RP 9':'Emenda de relator'};
const RPC = {'RP 2':'#5f6f66','RP 6':'#2e8a57','RP 7':'#b8650a','RP 8':'#7b4fa0','RP 9':'#a0522d','RP 1':'#1f4e79','RP 3':'#1f4e79'};
const dotDe = Lx => soma(Lx,'atu') || soma(Lx,'provRec');
function cartaoGR(campo, chave, titulo, cor, Lx, sel){
  const dot = dotDe(Lx), emp = soma(Lx,'emp'), pago = soma(Lx,'pago'), bloq = soma(Lx,'indisp'), p = dot ? Math.min(100, emp/dot*100) : 0;
  return `<div class="k gr ${sel?'sel':''}" data-k="${campo}" data-v="${esc(chave)}" style="--b:${cor}" title="clique para filtrar a tela por ${esc(titulo)}">
    <span style="color:${cor};font-weight:700">${esc(titulo)}</span><b>${ft(dot)}</b><small>dotação atual${soma(Lx,'atu')?'':' (provisionado)'}</small>
    <div class="gr-l"><div>Bloqueado<em style="color:${bloq>1?'#c0392b':'inherit'}">${ft(bloq)}</em></div><div>Empenhado<em>${ft(emp)} · ${dot?Math.round(emp/dot*100)+'%':'—'}</em></div><div>Pago<em>${ft(pago)}</em></div></div>
    <i class="gr-b"><i style="width:${p.toFixed(1)}%;background:${cor}"></i></i></div>`;
}
function blocosGndRp(){
  const LG = filtrar('gnd'), LR = filtrar('rp');
  const gs = [...new Set(LG.map(o => o.gnd))].sort(), rs = [...new Set(LR.map(o => o.rp))].sort();
  const gC = g => /GND 4/.test(g) ? '#1f4e79' : '#1f6b3a';
  return `<div class="grp">Grupo de despesa (GND) <small style="text-transform:none;letter-spacing:0;color:#7b8790;font-weight:500">· clique para filtrar</small></div>
    <div class="kp" style="grid-template-columns:repeat(${Math.max(1,gs.length)},1fr)">${gs.map(g => cartaoGR('gnd', g, g.replace('Outras despesas correntes','Custeio (outras despesas correntes)').replace('Investimentos','Investimento'), gC(g), LG.filter(o => o.gnd===g), SEL.gnd===g)).join('') || '<p class="d">sem dados</p>'}</div>
    <div class="grp">Discricionário × emendas <small style="text-transform:none;letter-spacing:0;color:#7b8790;font-weight:500">· resultado primário · clique para filtrar</small></div>
    <div class="kp" style="grid-template-columns:repeat(${Math.min(4,Math.max(1,rs.length))},1fr)">${rs.map(r => cartaoGR('rp', r, r+' · '+(RPN[r]||''), RPC[r]||'#5f6f66', LR.filter(o => o.rp===r), SEL.rp===r)).join('') || '<p class="d">sem dados</p>'}</div>`;
}
function linhaGR(LA){   // resumo da ação: dotação por GND e discricionário × emendas
  const d = k => dotDe(LA.filter(k)), g3 = d(o => o.gndC==='3'), g4 = d(o => o.gndC==='4'), em = d(o => /RP [6789]/.test(o.rp)), di = d(o => o.rp==='RP 2');
  const p = [g3?'GND 3 '+fm(g3):'', g4?'GND 4 '+fm(g4):'', di?'discricionário '+fm(di):'', em?'<b style="color:#7b4fa0">emendas '+fm(em)+'</b>':''].filter(Boolean);
  return p.length ? `<small class="gr-ac">${p.join(' · ')}</small>` : '';
}
function render(){
  desenharFiltros();
  const L = filtrar(), T = {}; M.forEach(k => T[k] = soma(L,k));
  document.getElementById('contagem').textContent = n(L.length)+' linhas no recorte' + (SEL.ugN && !/^130101/.test(SEL.ugN) ? ' · dotação, cortes e bloqueio: setorial 130101 nos PTRES só desta UG (PTRES compartilhados com outras UGs ficam fora)' : '');
  const remanej = T.sup + T.canc, porAc = agr(L,'acaoN');
  document.getElementById('corpo').innerHTML = `<div class="grp">Dotação</div><div class="kp k4">
    ${kpi('Lei (dotação inicial)', ft(T.ini), R$(T.ini), 'dest')}
    ${kpi('Créditos e cortes no ano', ft(remanej), 'suplementação '+ft(T.sup)+' · cancelado/remanejado '+ft(T.canc), remanej<0?'red':'verde')}
    ${kpi('Dotação atual', ft(T.atu), pct(T.atu,T.ini)+' da Lei')}
    ${kpi('Bloqueado (crédito indisponível)', ft(T.indisp), pct(T.indisp,T.atu)+' da dotação atual', T.indisp>1?'red':'')}
  </div><div class="grp">Execução</div><div class="kp k5">
    ${kpi('Provisionado às UGs', ft(T.provRec), T.atu ? pct(T.provRec,T.atu)+' da dotação atual' : 'recebido por provisão · a dotação fica na setorial (130101)')}
    ${kpi('Empenhado', ft(T.emp), T.atu ? pct(T.emp,T.atu)+' da dotação atual' : pct(T.emp,T.provRec)+' do provisionado', 'verde')}
    ${kpi('Liquidado', ft(T.liq), pct(T.liq,T.emp)+' do empenhado · a pagar '+ft(T.liq-T.pago))}
    ${kpi('Pago', ft(T.pago), pct(T.pago,T.liq)+' do liquidado · '+pct(T.pago,T.emp)+' do empenhado')}
    ${(() => { const dS = soma(L.filter(o => o.ug==='130101'),'disp'), dU = T.disp - dS;
      return kpi('Crédito disponível', ft(T.disp), 'na setorial (ainda não provisionado) '+ft(dS)+' · nas UGs (provisionado, sem empenho) '+ft(dU)+'<br><b style="display:inline;font-size:12px;color:#1f4e79">'+(window.__cred?'▲ fechar o detalhe':'▼ clique para ver onde está')+'</b>', (T.disp>1?'amar ':'')+'cred-k'); })()}
  </div>${blocosGndRp()}${window.__cred ? credDetalhe(L) : ''}<div class="g2">
    <section class="card"><h3>Empenhado × dotação atual, por ação</h3><p class="d">percentual empenhado · clique para filtrar</p>${hbar([...porAc].map(([k,x]) => [k, x.emp]).sort((a,b) => b[1]-a[1]), 'acaoN', '#2e8a57', fm, k => pct(porAc.get(k).emp, porAc.get(k).atu))}</section>
    <section class="card"><h3>Crédito disponível por ação</h3><p class="d">saldo para empenhar (setorial + UGs) · clique para filtrar</p>${hbar([...porAc].map(([k,x]) => [k, x.disp]).filter(x => Math.abs(x[1])>1).sort((a,b) => b[1]-a[1]), 'acaoN', '#b7860b', fm, k => pct(porAc.get(k).disp, porAc.get(k).atu))}</section>
    <section class="card"><h3>Crédito disponível por UG</h3><p class="d">onde está o saldo: na setorial (130101) ainda não foi provisionado; nas UGs já foi provisionado e falta empenhar · clique para filtrar</p>${(() => { const pu = agr(L,'ugN'); return hbar([...pu].map(([k,x]) => [k, x.disp]).filter(x => Math.abs(x[1])>1).sort((a,b) => b[1]-a[1]), 'ugN', '#b7860b', fm, k => pct(pu.get(k).disp, T.disp)); })()}</section>
    <section class="card"><h3>Bloqueado por ação</h3><p class="d">crédito indisponível · clique para filtrar</p>${hbar([...porAc].map(([k,x]) => [k, x.indisp]).filter(x => x[1]>1).sort((a,b) => b[1]-a[1]), 'acaoN', '#c0392b', fm, k => pct(porAc.get(k).indisp, porAc.get(k).atu))}</section>
  </div>`;
  // tabela ação → PO (→ UG ao clicar)
  const cols = [['Lei','ini'],['Supl.','sup'],['Cancel./reman.','canc'],['Dotação atual','atu'],['Bloqueado','indisp'],['Provisionado','provRec'],['Empenhado','emp'],['Liquidado','liq'],['Pago','pago'],['Disponível','disp']];
  const cel = (x, k) => `<td class="${k==='indisp'&&x[k]>1?'bloq':k==='canc'&&x[k]<0?'neg':k==='canc'&&x[k]>0?'pos':''}">${f2(x[k])}</td>`;
  let h = `<table class="ot"><tr><th>Ação / plano orçamentário</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}<th>% emp.</th></tr>`;
  [...porAc].sort((a,b) => b[1].atu-a[1].atu).forEach(([ac, x]) => {
    h += `<tr class="ac"><td>${esc(ac)} <button type="button" class="bf" data-ficha="${esc(ac)}">ficha</button>${linhaGR(L.filter(o => o.acaoN===ac))}</td>${cols.map(c => cel(x,c[1])).join('')}<td>${pct(x.emp,x.atu)}</td></tr>`;
    const LA = L.filter(o => o.acaoN===ac), porPO = agr(LA,'poN');
    [...porPO].sort((a,b) => a[0].localeCompare(b[0])).forEach(([po, y]) => {
      const ch = ac+'|'+po, ab = ABERTO.has(ch);
      h += `<tr class="po ${ab?'aberto':''}" data-ab="${esc(ch)}"><td>${ab?'▾':'▸'} ${esc(po)}${linhaGR(LA.filter(o => o.poN===po))}</td>${cols.map(c => cel(y,c[1])).join('')}<td>${pct(y.emp,y.atu)}</td></tr>`;
      if(ab){ const porUG = agr(LA.filter(o => o.poN===po),'ugN');
        h += `<tr class="ug"><td><b>UG</b></td><td colspan="4" style="text-align:left"><b>provisão recebida · destaque concedido</b></td><td><b>Bloqueado</b></td><td></td><td><b>Empenhado</b></td><td><b>Liquidado</b></td><td><b>Pago</b></td><td><b>Disponível</b></td><td></td></tr>`;
        [...porUG].sort((a,b) => a[0].localeCompare(b[0])).forEach(([ug, z]) => {
          h += `<tr class="ug"><td>${esc(ug)}</td><td colspan="4" style="text-align:left">${z.provRec?'recebeu '+R$(z.provRec):z.provConc?'concedeu '+R$(z.provConc):'—'}${z.destConc?' · destaque (TED) '+R$(z.destConc):''}${z.atu?' · dotação '+R$(z.atu):''}</td>${cel(z,'indisp')}<td></td>${cel(z,'emp')}${cel(z,'liq')}${cel(z,'pago')}${cel(z,'disp')}<td>${z.provRec?pct(z.emp,z.provRec):''}</td></tr>`; });
      }
    });
  });
  document.getElementById('tabela').innerHTML = h + `<tr class="ac"><td>Total</td>${cols.map(c => cel(T,c[1])).join('')}<td>${pct(T.emp,T.atu||T.provRec)}</td></tr></table>`;
}
