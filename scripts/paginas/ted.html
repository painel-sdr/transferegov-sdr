function ufDoNome(nome){
  const n = ' '+normAccent(nome).replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ')+' ';
  if(n.includes(' EMBRAPA ')){ for(const [p,uf] of EMBRAPA_UF) if(n.includes(' '+p+' ')) return uf; }
  const sig = normAccent(nome).match(/[\/\-–(]\s*([A-Z]{2})\s*\)?\s*$/); if(sig && UF_NOMES[sig[1]]) return sig[1];
  for(const [p,uf] of UF_PISTAS.concat(UF_PISTAS_EXTRA)){ const t = ' '+p.trim()+' '; if(n.includes(t) || (p.endsWith(' ') && n.includes(' '+p))) return uf; }
  return '';
}

window.BM_TABS = {'l':'b', k:'kpi'};
const P = __DADOS__, D = P.linhas, ANO = P.ano;
const FASES = ['Em execução','Vigência vencida','Prestação de contas','Concluído','Dispensa de TED','Recebido sem nº de TED','Em formalização','Só no Tesouro','Plano em análise','Plano rejeitado'];
const TES = P.tes || {};
const COR_F = {'Em execução':'#2e8a57','Vigência vencida':'#c0392b','Prestação de contas':'#b7860b','Concluído':'#1f4e79','Em formalização':'#6c5ce7','Plano em análise':'#7b8790','Plano rejeitado':'#b2bec3','Só no Tesouro':'#16a085','Dispensa de TED':'#c8742f','Recebido sem nº de TED':'#8e44ad'};
const SIT = {EM_EXECUCAO:'Em execução',CUMPRIMENTO_OBJETO_INICIADO:'Cumprimento do objeto iniciado',CUMPRIMENTO_OBJETO_ENVIADO_ANALISE:'Cumprimento do objeto em análise',
  CUMPRIMENTO_OBJETO_APROVADO:'Cumprimento do objeto aprovado',CUMPRIMENTO_OBJETO_APROVADO_COM_RESSALVAS:'Aprovado com ressalvas',PENDENTE_REGISTRO_NO_SIAFI:'Pendente de registro no SIAFI',
  EM_ELABORACAO:'Em elaboração',ENVIADO:'Enviado',APROVADO:'Aprovado',REJEITADO:'Rejeitado',ENVIADO_ANALISE:'Enviado para análise',ANALISE_APROVADA:'Análise aprovada',EM_ANALISE:'Em análise',EM_COMPLEMENTACAO:'Em complementação'};
const sitN = s => SIT[s] || String(s||'').replace(/_/g,' ').toLowerCase().replace(/^./, c => c.toUpperCase());
// envio × devolução (devolução: evento 300301/701202/701459 ou "devolução" na observação · vem negativa do robô)
const ehDevNC = x => x[9] === 'Devolução' || (+x[4] || 0) < 0, ehDevPF = x => String(x[5]||'').startsWith('Devolução') || (+x[4] || 0) < 0;
const somaDev = (L, ehDev) => L.filter(ehDev).reduce((a, x) => a + (+x[4] || 0), 0);
let FICHA_REC = false;   // TED recebido: o crédito "entra" (Recebido), não é envio
const TIPO_B = (d, x) => { const rot = !d ? (FICHA_REC ? 'Recebido' : 'Envio') : (x && x[9] !== 'Devolução' && !String(x[5]||'').startsWith('Devolução')) ? 'Anulação' : 'Devolução';
  return `<span style="display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:${d?'#fdecea':'#e3f1da'};color:${d?'#a3271b':'#1f5d34'}">${rot}</span>`; };
const subEnvDev = (liq, dev) => `<small style="display:block;font-size:11.5px;color:#5f6f66;line-height:1.5;margin-top:4px">${FICHA_REC?'recebido':'enviado'} <b style="display:inline;font-size:11.5px">${R$(liq - dev)}</b><br>devolvido <b style="display:inline;font-size:11.5px;color:#c0392b">− ${R$(-dev)}</b></small>`;
const f2z = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const totEnvDev = (L, ehDev, liq, cols, rotLiq) => { const dev = somaDev(L, ehDev), nE = L.filter(x => !ehDev(x)).length, nD = L.length - nE;
  return `<tr style="background:#f4f7f5;font-weight:700"><td colspan="${cols}">${FICHA_REC ? 'Recebido' : 'Enviado'} (${nE})</td><td class="n">${f2z(liq - dev)}</td></tr>`
   + `<tr style="background:#f4f7f5;font-weight:700;color:#a3271b"><td colspan="${cols}">Devolvido / anulado (${nD})</td><td class="n">− ${f2z(-dev)}</td></tr>`
   + `<tr style="background:#e3edf7;font-weight:700;color:#1f4e79"><td colspan="${cols}">${rotLiq}</td><td class="n">${f2z(liq)}</td></tr>`; };
const UGN = {'420013':'420013 · SDR','130141':'130141','130010':'130010','130255':'130255','135098':'135098'};
D.forEach(o => {
  o.rpN = o.rp ? [...new Set(o.rp.split(' | '))].join(' + ') : 'Não informado';
  o.fx = o.dias===null ? '(sem vigência)' : o.dias<0 ? 'Vencida' : o.dias<=30 ? 'Até 30 dias' : o.dias<=60 ? '31 a 60 dias' : o.dias<=90 ? '61 a 90 dias' : o.dias<=180 ? '91 a 180 dias' : o.dias<=365 ? '181 a 365 dias' : 'Mais de 1 ano';
  o.ugdN = o.er==='Recebido' ? (UGN[o.ugr] || o.ugr)+' · recebido' : (UGN[o.ugd] || o.ugd);   // a UG da SDR: quem enviou ou, no recebido, quem recebeu
  o.spN = sitN(o.sp); o.stN = o.st==='(sem termo)' ? '(sem termo)' : sitN(o.st);
  o.chave = o.n || 'PA '+o.cod;
  // ações do TED separadas (TED com mais de uma ação conta em cada uma) e o valor firmado repartido pelas notas de crédito de cada ação
  o.ac = o.acao==='(sem ação)' ? ['(sem ação)'] : o.acao.split(' | ');
  const pn = {}; (o.nca||[]).forEach(x => { const a = String(x[0]||'').toUpperCase(); if(o.ac.includes(a)) pn[a] = (pn[a]||0) + Math.max(0, x[5]||0); });
  const tn = Object.values(pn).reduce((a,b) => a+b, 0);
  o.acPeso = Object.fromEntries(o.ac.map(a => [a, tn ? (pn[a]||0)/tn : 1/o.ac.length]));
  // UF: a do controle interno; sem ela, pelo nome da unidade que recebe
  if(!o.uf){ const u = ufDoNome([o.unr, o.tes && o.tes.nome].filter(Boolean).join(' ')); if(u){ o.uf = u; o.ufInf = true; } }
  o.ufF = o.uf && MAPA_BR.ufs[o.uf] ? o.uf : '(sem UF)';
});
const FX_V = ['Vencida','Até 30 dias','31 a 60 dias','61 a 90 dias','91 a 180 dias','181 a 365 dias','Mais de 1 ano'];

function filtrar(exceto){ return base().filter(o => FIL.every(([k]) => k===exceto || !SEL[k] || String(o[k])===SEL[k])); }

function hbar(lista, campo, cor, fmt, tot){
  const mx = Math.max(1,...lista.map(x => Math.abs(x[1])));
  return lista.map(([k,v],i) => `<div class="hb ${campo && ehSel(campo,k)?'sel':''}" ${campo?`data-k="${campo}" data-v="${esc(k)}"`:''} title="${esc(k)}"><span class="hbr">${esc(k)}</span><div><i style="width:${Math.abs(v)/mx*100}%;background:${typeof cor==='function'?cor(k,i):cor}"></i></div><b>${fmt?fmt(v):n(v)}</b><em>${tot?Math.round(v/tot*100)+'%':''}</em></div>`).join('') || '<p class="d">nada neste recorte</p>';

function colunas(lista, campo, cor, fmt){
  const mx = Math.max(1,...lista.map(x => x[1]));
  return `<div class="bx">${lista.map(([k,v,c2]) => `<div class="${campo && ehSel(campo,k)?'sel':''}" ${campo?`data-k="${campo}" data-v="${esc(k)}"`:''} title="${esc(k)}: ${fmt?fmt(v):n(v)}"><em>${fmt?fmt(v):n(v)}</em><i style="height:${Math.max(2,v/mx*100)}%;background:${c2||cor}"></i><small>${esc(k)}</small></div>`).join('')}</div>`;
}
const agrupar = (L, k, val) => { const m = {}; L.forEach(o => { const c = o[k]; m[c] = (m[c]||0) + (val ? val(o) : 1); }); return Object.entries(m).sort((a,b) => b[1]-a[1]); };

// a página fica dentro de um iframe que cresce com o conteúdo: a janela da ficha abre na parte que a pessoa está vendo
function posModal(f){
  // abre a ficha na altura do clique: é a parte que a pessoa está vendo, mesmo quando quem rola é a página do Google Sites
  // (o painel não consegue ler o rolamento do Sites). O fundo escuro cobre a página inteira; a ficha não tem rolagem própria.
  try{
    const docH = () => Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    const y = window.__cliqueY != null ? window.__cliqueY : (window.scrollY || 0);
    const j = f.firstElementChild;
    f.style.position = 'absolute'; f.style.left = '0'; f.style.right = '0'; f.style.top = '0'; f.style.bottom = 'auto'; f.style.overflow = 'visible';
    if(j) j.style.marginTop = Math.max(0, y - 120) + 'px';
    f.style.height = 'auto'; f.style.minHeight = docH() + 'px';
  }catch(e){}
}
