<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Execução Financeira · TESTE v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#155a30;--verde2:#1f6b3a;--verde3:#2f8a4c;--escuro:#133a2a;--texto:#1d2b24;--mudo:#5f6f66;--fundo:#e9efe9;--linha:#d6e0d8;--ouro:#f2b33d;--ambar:#b8650a;--ambarbg:#fdf0dc;--azul:#1f4e79;--azulbg:#e3edf7;--verdebg:#e3f1da;--vermelho:#b3261e;--vermbg:#fdecea;--cinzabg:#eef2ee}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Barlow,system-ui,sans-serif;color:var(--texto);background:var(--fundo);font-size:15px}
button,input,select,textarea{font:inherit}
.oculto{display:none!important}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,sans-serif;margin:0}
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 700px at 85% 110%,#4c6b2a 0,#1c4a33 45%,#0d2a1f 85%);padding:24px}
.lg-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:30px 30px 22px;box-shadow:0 30px 60px #0008}
.lg-kick{font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--verde2)}
.lg-card h1{font-size:30px;color:var(--escuro);margin:6px 0 4px}
.lg-sub{color:var(--mudo);margin:0 0 18px;line-height:1.45}
.campo{display:block;font-size:13px;font-weight:600;color:#3d5a4b;margin-bottom:12px}
.campo input,.campo select,.campo textarea{display:block;width:100%;margin-top:5px;min-height:42px;border:1.5px solid #cfdcd3;border-radius:10px;padding:0 12px;background:#fff;color:var(--texto);font-weight:500}
.campo textarea{padding:10px 12px;resize:vertical;min-height:64px}
.campo input:focus,.campo select:focus,.campo textarea:focus,.mini:focus{outline:0;border-color:var(--verde3);box-shadow:0 0 0 4px #2f8a4c22}
.campo input[readonly]{background:#f1f4f1;color:var(--mudo)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:10px;border:0;background:var(--verde);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.bt:hover{background:#0f4826}.bt:disabled{opacity:.55;cursor:wait}
.bt.sec{background:#fff;color:var(--verde);border:1.5px solid #cfdcd3}.bt.sec:hover{background:var(--cinzabg)}
.bt.alerta{background:#fff;color:var(--ambar);border:1.5px solid #e7c48f}
.bt.peq{height:36px;padding:0 12px;font-size:14px}
.bt.larga{width:100%;height:48px;font-size:16px}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 14px;line-height:1.4}
.msg.erro{background:var(--vermbg);color:var(--vermelho)}.msg.info{background:var(--verdebg);color:#1f5d34}.msg.aviso{background:var(--ambarbg);color:#8a4c08}
.lg-aviso{font-size:12px;color:#7a877f;text-align:center;margin:16px 0 0}
.lk{color:var(--verde2);font-weight:700;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
#topo{background:var(--verde);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 24px}
#topo .marca{display:flex;flex-direction:column}
#topo .marca small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#cfe5d6;font-weight:600}
#topo .marca b{font-family:"Barlow Semi Condensed";font-size:22px}
.teste{background:var(--ouro);color:#3a2a00;font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px;letter-spacing:.06em}
#topo .busca-g{flex:1 1 300px;max-width:520px}
#topo .busca-g input{width:100%;height:38px;border-radius:10px;border:0;padding:0 14px;font-weight:500}
#topo .eu{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
#topo .eu .perfil{background:#ffffff26;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px}
#topo .bt.sec{height:34px;background:#ffffff1a;color:#fff;border-color:#ffffff55}
#corpo{display:flex;flex-wrap:wrap;min-height:calc(100vh - 64px)}
#menu{flex:1 1 210px;max-width:100%;background:#fff;border-right:1px solid var(--linha);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
#menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;min-height:42px;border:0;background:transparent;border-radius:9px;padding:0 12px;cursor:pointer;color:var(--texto);font-weight:600}
#menu button:hover{background:var(--cinzabg)}
#menu button.on{background:var(--verde2);color:#fff}
#menu button .n{font-size:12px;background:var(--cinzabg);color:var(--mudo);border-radius:999px;padding:1px 8px}
#menu button.on .n{background:#ffffff33;color:#fff}
#menu .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mudo);padding:14px 12px 4px;font-weight:700}
#tela{flex:999 1 560px;min-width:0;padding:22px 26px 60px;display:flex;flex-direction:column;gap:16px}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.cab h2{font-size:28px;color:var(--escuro)}
.cab p{margin:4px 0 0;color:var(--mudo);max-width:900px;line-height:1.45}
.card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:16px 18px}
.card h3{font-size:18px;color:var(--escuro);margin-bottom:10px}
.card h3 small{font-family:Barlow;font-weight:500;font-size:13px;color:var(--mudo)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 16px}
.kpi span{font-size:13px;color:var(--mudo)}.kpi b{display:block;font-size:24px;font-family:"Barlow Semi Condensed";margin-top:2px}.kpi small{color:var(--mudo);font-size:12px}
.kpi.neg b{color:var(--vermelho)}.kpi.pos b{color:var(--verde2)}
.rolar{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mudo);font-weight:700;padding:8px;border-bottom:1.5px solid var(--linha);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #e8eee9;vertical-align:middle}
td .s{display:block;font-size:12.5px;color:var(--mudo)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faf3}
.st{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st-REFORCO{background:var(--ambarbg);color:var(--ambar)}
.st-RECEBIDO,.st-NO_ORCAMENTO{background:#efe9f7;color:#5b3d8a}
.st-DEVOLVIDO{background:var(--vermbg);color:var(--vermelho)}
.motivo{display:block;color:var(--vermelho);font-size:12.5px;margin-top:3px}
tr.dev td{background:#fdf3f2}
.filtro-orc{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.filtro-orc label{font-size:13px;font-weight:600;color:#3d5a4b;display:flex;flex-direction:column;gap:4px}
.abas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.abas small{opacity:.75;margin-left:4px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.chk input{width:17px;height:17px;accent-color:#1f6b3a}
.filtros label.chk{flex-direction:row;align-self:center;margin-top:20px}
.neg{color:var(--vermelho)}
.st-SALDO_OK{background:var(--azulbg);color:var(--azul)}
.st-DISTRIBUIDO{background:var(--ambarbg);color:#8a4c08}
.st-INFORMADO{background:var(--azulbg);color:var(--azul)}
.st-CONFIRMADO{background:var(--verdebg);color:#1f5d34}
.st-AJUSTAR{background:var(--vermbg);color:var(--vermelho)}
.rec{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.rec-EXE001{background:var(--azulbg);color:var(--azul)}.rec-RAP001{background:var(--verdebg);color:#1f5d34}
.mini{height:38px;border:1.5px solid #cfdcd3;border-radius:9px;padding:0 10px;background:#fff;color:var(--texto)}
.form{background:#f6f9f4;border:1px solid var(--linha);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 14px}
.form .tudo{grid-column:1/-1}
.ne{display:flex;align-items:center;gap:10px;border:1.5px solid var(--linha);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.ne.sel{border-color:var(--verde3);background:#f0f8f1}
.ne input{width:18px;height:18px;accent-color:var(--verde2)}
.ne .v{margin-left:auto;text-align:right}
.acoes{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.barra{height:8px;background:#e8eee9;border-radius:4px;overflow:hidden;margin:6px 0 12px}.barra i{display:block;height:8px;background:var(--verde3)}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filtros label{font-size:13px;font-weight:600;color:#3d5a4b;display:flex;flex-direction:column;gap:4px}
.chip{height:36px;border-radius:999px;border:1.5px solid #cfdcd3;background:#fff;padding:0 14px;font-weight:700;cursor:pointer;color:var(--texto)}
.chip.on{background:var(--escuro);border-color:var(--escuro);color:#fff}
.vazio{color:var(--mudo);padding:14px 4px}
.lista-inst{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.inst{text-align:left;background:#fff;border:1px solid var(--linha);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.inst:hover{border-color:var(--verde3)}
.inst b{font-size:16px}.inst span{font-size:13px;color:var(--mudo)}
.inst .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--cinzabg);color:var(--mudo)}
.tag.neg{background:var(--vermbg);color:var(--vermelho)}.tag.aj{background:var(--ambarbg);color:var(--ambar)}
.blocos{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.linhas-val{display:flex;flex-direction:column}
.linhas-val div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e1e8e2;font-size:15px}
.linhas-val div b{font-variant-numeric:tabular-nums}
.linhas-val div.total{border-bottom:0;border-top:1.5px solid var(--linha);font-weight:700;padding-top:9px}
.linhas-val div.total.neg b{color:var(--vermelho)}.linhas-val div.total.pos b{color:var(--verde2)}
dl.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px;margin:0}
dl.dados dt{font-size:12.5px;color:var(--mudo)}dl.dados dd{margin:0;font-weight:600}
/* grade anual (estilo planilha) */
.grade{font-size:12.5px;min-width:1500px}
.grade th{font-size:11px;padding:7px 6px;background:var(--escuro);color:#fff;position:sticky;top:0;border:0}
.grade td{padding:6px;border:1px solid #e3e9e4}
.grade td.m{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:84px}
.grade td.prev{color:#9aa79f;font-style:italic}
.grade td.c-CONFIRMADO{background:#e3f1da;color:#1f5d34;font-weight:700}
.grade td.c-INFORMADO{background:#e3edf7;color:var(--azul);font-weight:700}
.grade td.c-AJUSTAR{background:#fdecea;color:var(--vermelho);font-weight:700}
.grade td.c-ABERTO{background:#fdf0dc;color:#8a4c08;font-weight:700}
.grade td.def{background:#1d2b24;color:#f6c560;font-weight:700;text-align:right;white-space:nowrap}
.grade td.def.ok{color:#b9e3c3}
.grade tr:hover td:not(.def){filter:brightness(.97)}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--mudo)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.prev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.prev-grid label{font-size:12.5px;font-weight:600;color:var(--mudo);display:flex;flex-direction:column;gap:3px}
.prev-grid input{height:36px;border:1.5px solid #cfdcd3;border-radius:8px;padding:0 8px;text-align:right}
.res-tes{max-height:260px;overflow:auto;border:1px solid var(--linha);border-radius:10px;background:#fff}
.res-tes label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid #eef2ee;font-size:13.5px;cursor:pointer}
#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--escuro);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;box-shadow:0 10px 30px #0005;z-index:10;max-width:90vw}
#aviso.erro{background:var(--vermelho)}
body.atualizando #bt-atualizar{opacity:.6;pointer-events:none}
body.atualizando #bt-atualizar::after{content:'…'}
body.atualizando #menu::before{content:'Atualizando com a base…';display:block;font-size:12px;font-weight:700;color:var(--ambar);background:var(--ambarbg);border-radius:8px;padding:6px 10px;margin-bottom:6px}
.rodape{font-size:12px;color:var(--mudo)}
@media (max-width:760px){#tela{padding:16px 12px 50px}#menu{border-right:0;border-bottom:1px solid var(--linha)}}
</style>
</head>
<body>

<section id="login" class="oculto">
  <div class="lg-card">
    <div class="lg-kick">SDR · MAPA · Teste</div>
    <h1 id="lg-tit">Painel de Execução</h1>
    <p class="lg-sub" id="lg-sub"></p>
    <div id="lg-msg"></div>
    <form id="f-config" class="oculto">
      <label class="campo">Link do Apps Script (termina em /exec)<input id="in-api" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <button class="bt larga" type="submit">Salvar e continuar →</button>
    </form>
    <form id="f-email" class="oculto">
      <label class="campo">Seu e-mail<input id="in-email" type="email" autocomplete="email" placeholder="nome@exemplo.com"></label>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mudo);margin:0 0 14px"><input type="checkbox" id="in-lembrar" checked style="width:16px;height:16px;accent-color:#1f6b3a"> Lembrar neste aparelho por 30 dias</label>
      <button class="bt larga" type="submit">Receber código →</button>
      <p class="lg-aviso"><button type="button" class="lk" id="trocar-api">Trocar o link do Apps Script</button></p>
    </form>
    <form id="f-codigo" class="oculto">
      <label class="campo">Código de 6 números<input id="in-cod" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="font-size:26px;letter-spacing:.4em;text-align:center;font-weight:700"></label>
      <button class="bt larga" type="submit">Entrar →</button>
      <p class="lg-aviso"><button type="button" class="lk" id="voltar-email">Trocar e-mail ou reenviar</button> · o código vale 10 minutos</p>
    </form>
    <p class="lg-aviso">Controle interno da coordenação financeira · SDR/MAPA. Não é um site oficial do Ministério.</p>
  </div>
</section>

<section id="app" class="oculto">
  <header id="topo">
    <div class="marca"><small>SDR · MAPA</small><b>Execução Financeira <span id="t-ano"></span></b></div>
    <span class="teste">TESTE · v2</span>
    <div class="busca-g"><label for="busca-g" style="position:absolute;left:-9999px">Buscar instrumento</label><input id="busca-g" type="search" placeholder="Buscar: contrato, instrumento, proposta, processo, CNPJ, NE…"></div>
    <div class="eu"><span id="eu-nome"></span><span class="perfil" id="eu-perfil"></span>
      <button class="bt sec peq" id="bt-atualizar" type="button">Atualizar</button>
      <button class="bt sec peq" id="bt-sair" type="button">Sair</button></div>
  </header>
  <div id="corpo"><nav id="menu" aria-label="Menu"></nav><main id="tela"></main></div>
</section>
<div id="aviso" class="oculto" role="status"></div>

<script>
(function(){
'use strict';
var API_PADRAO = 'https://script.google.com/macros/s/AKfycbxrspYIO3IfFxP_Rnt7pPPA5vw5QDO4jHKEQcfYCgYv_Bs8tBkiLQfAe-05Qny7P6XN/exec';
var K_API = 'exec27Api', K_SES = 'exec27Sessao', K_DADOS = 'exec27Dados';
var $ = function(id){ return document.getElementById(id); };
var D = null, VIEW = null, FICHA = null, EDITAR = null, ABERTO = null, FILA_TODAS = false, EMAIL = '';
var F = {orc: '', ug: '', form: '', corrigir: 'TODOS', rec: '', busca: '', dem: '', mostrar: 'ATIVOS', lim: 60};
var LISTAS = {
  formalizacao: ['Contrato','Ata','Compartilhamento','Não contratual','Suprimento de fundos','TED','Convênio','Contrato de Repasse','Termo de fomento','Termo de colaboração'],
  orcamento: ['CEPLAC','DECAP','DEPROS','DIAGRO','ORGÂNICO','GABINETE','CGPI','PROMAQ','CONTRATO REPASSE','DEFLO'],
  ug: ['130010','420013','130141','130255','135098'],
  atividade: ['Funcionamento','Deslocamento','Outras Despesas'],
  regiao: ['Norte','Nordeste','Centro-Oeste','Sudeste','Sul'],
  uf: 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' '),
  ddoSit: ['A empenhar','Empenhado'], ddoObj: ['Contratação','Prorrogação','Repactuação/Reajuste','Outro']
};

/* ---------- utilitários ---------- */
function ls(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function api(){ var q = new URLSearchParams(location.search).get('api'); if(q) ls(K_API, q); var g = ls(K_API); if(g && API_PADRAO && g.indexOf('AKfycbxbC5T9') >= 0){ ls(K_API, null); g = null; } return g || API_PADRAO || ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ if(typeof v === 'number') return v; var s = String(v || '').replace(/R\$|\s/g, ''); if(!s) return 0; if(s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); var n = parseFloat(s); return isNaN(n) ? 0 : n; }
function brl(v){ return (Number(v) || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}); }
function brlc(v){ v = Number(v) || 0; if(!v) return '—'; var a = Math.abs(v); var t = a >= 1e6 ? (a/1e6).toLocaleString('pt-BR', {maximumFractionDigits: 2}) + ' mi' : a >= 1e3 ? (a/1e3).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + ' mil' : a.toLocaleString('pt-BR', {maximumFractionDigits: 0}); return (v < 0 ? '− ' : '') + t; }
function v2(v){ return brl(v); }   // campos de valor já aparecem com R$
var CAMPO_MOEDA = /^(valor|valor_global|valor_parcela|executado_anteriores|\d{4}-\d{2})$/;
function mascaraMoeda(el){ var d = el.value.replace(/\D/g, '').replace(/^0+/, ''); el.value = d ? brl(Number(d) / 100) : ''; }
var MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function comp(c){ c = String(c || ''); var m = +c.slice(5,7); return m ? MES[m-1] + '/' + c.slice(2,4) : c; }
function dt(s){ if(!s) return ''; s = String(s); return s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) + (s.length > 11 ? ' ' + s.slice(11,16) : ''); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
var ST = {RECEBIDO: 'Aguardando analista', NO_ORCAMENTO: 'Com o analista', DEVOLVIDO: 'Devolvido pelo financeiro', REFORCO: 'Reforço de NE', SALDO_OK: 'Saldo confirmado', DISTRIBUIDO: 'A pagar', INFORMADO: 'Informado · aguarda Tesouro', CONFIRMADO: 'Confirmado pelo Tesouro', AJUSTAR: 'Ajustar'};
function st(s){ return '<span class="st st-' + esc(s) + '">' + esc(ST[s] || s) + '</span>'; }
function rec(r){ return r ? '<span class="rec rec-' + esc(r) + '">' + esc(r) + '</span>' : '—'; }
function opts(lista, sel, vazio){ return (vazio != null ? '<option value="">' + vazio + '</option>' : '') + lista.map(function(o){ return '<option' + (String(o) === String(sel) ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); }
function aviso(t, erro){ var a = $('aviso'); a.textContent = t; a.className = erro ? 'erro' : ''; clearTimeout(aviso._t); aviso._t = setTimeout(function(){ a.className = 'oculto'; }, 4200); }

/* ---------- cálculos por instrumento (contrato × ano) ---------- */
var IX = null;
function indexar(){
  IX = {prev: {}, pag: {}, ddo: {}, tes: {}};
  D.previsao.forEach(function(p){ (IX.prev[p.instrumento_id] = IX.prev[p.instrumento_id] || {})[p.competencia] = num(p.valor); });
  D.pagamentos.forEach(function(p){ (IX.pag[p.instrumento_id] = IX.pag[p.instrumento_id] || []).push(p); });
  D.ddo.forEach(function(d){ (IX.ddo[d.instrumento_id] = IX.ddo[d.instrumento_id] || []).push(d); });
  D.tesouro.forEach(function(t){ IX.tes[t.ne + '|' + t.ug] = t; });
}
function nesDe(i){ return (i.nes_vinculadas || []).map(function(n){ return IX.tes[n + '|' + i.ug]; }).filter(Boolean); }
function calc(i){
  if(i._c) return i._c;
  var nes = nesDe(i), prev = IX.prev[i.id] || {}, porMes = {};
  var pags = IX.pag[i.id] || [];
  var informado = 0, aberto = 0, ajustar = 0;
  pags.forEach(function(p){
    var m = porMes[p.competencia] || (porMes[p.competencia] = {v: 0, st: ''});
    if(/INFORMADO|CONFIRMADO|AJUSTAR/.test(p.situacao)){ informado += num(p.valor); m.v += num(p.valor); }
    else if(/DISTRIBUIDO|SALDO_OK|REFORCO|RECEBIDO|NO_ORCAMENTO|DEVOLVIDO/.test(p.situacao)){ aberto += num(p.valor); if(!m.v) m.aberto = (m.aberto || 0) + num(p.valor); }
    var ord = {AJUSTAR: 5, INFORMADO: 4, DISTRIBUIDO: 3, SALDO_OK: 3, REFORCO: 3, NO_ORCAMENTO: 3, RECEBIDO: 3, DEVOLVIDO: 4, CONFIRMADO: 2};
    if((ord[p.situacao] || 0) > (ord[m.st] || 0)) m.st = p.situacao;
  });
  var s = function(k){ return nes.reduce(function(a, t){ return a + num(t[k]); }, 0); };
  var previsaoAno = D.competencias.reduce(function(a, c){ return a + (prev[c] || 0); }, 0);
  var liqAno = nes.reduce(function(a, t){ return a + num(t.liquidado) - num(t.base_liquidado); }, 0);
  var faltaAno = Math.max(0, previsaoAno - liqAno);
  var saldo = s('saldo');
  var global = num(i.valor_global), ant = num(i.executado_anteriores);
  var ddo = (IX.ddo[i.id] || []).reduce(function(a, d){ return a + num(d.valor); }, 0);
  return (i._c = {nes: nes, prev: prev, porMes: porMes, pags: pags, previsaoAno: previsaoAno, liqAno: liqAno, faltaAno: faltaAno, saldo: saldo,
    empenhado: s('empenhado'), pago: s('pago'), deficit: saldo - faltaAno, informado: informado, aberto: aberto,
    ajustar: liqAno - informado, global: global, anteriores: ant, saldoContrato: global ? global - ant - liqAno : 0, ddo: ddo});
}
function chaves(i){
  if(i._k) return i._k;
  var p = (IX.pag[i.id] || []).map(function(x){ return x.processo_pagamento; });
  var d = (IX.ddo[i.id] || []).map(function(x){ return x.processo; });
  var txt = [i.numero, i.instrumento, i.proposta, i.processo_raiz, i.favorecido, i.cnpj, i.sigla, i.objeto, i.ug, i.orcamento, i.formalizacao].concat(i.nes_vinculadas || [], p, d).join(' ');
  return (i._k = {t: norm(txt), d: txt.replace(/\D/g, ' ').replace(/\s+/g, ' ') + ' ' + txt.replace(/\D/g, '')});
}
function bate(i, q){
  q = String(q || '').trim(); if(!q) return true;
  var k = chaves(i), dg = q.replace(/\D/g, '');
  if(dg.length >= 4 && k.d.indexOf(dg) >= 0) return true;
  return norm(q).split(/\s+/).every(function(w){ return k.t.indexOf(w) >= 0; });
}

function acao(o, ok, depois){
  o.devolver = true; aviso('Salvando…'); document.body.classList.add('atualizando');

    document.body.classList.remove('atualizando');
    if(!r.ok){ aviso(r.msg || 'Não deu certo.', true); reativar(); return; }
    aviso(typeof ok === 'function' ? ok(r) : ok); if(depois) depois(r);
    if(r.dados && r.dados.ok){ D = r.dados; ls(K_DADOS, r.dados); montar(); return; }   // base já veio na resposta

/* ---------- Visão geral do ano: grade dez → dez ---------- */
function telaGeral(){
  var lst = D.instrumentos.filter(function(i){
    if(F.orc && i.orcamento !== F.orc || F.ug && String(i.ug) !== F.ug || F.form && i.formalizacao !== F.form) return false;
    var temPag = (IX.pag[i.id] || []).length, temPrev = Object.keys(IX.prev[i.id] || {}).length;
    if(F.mostrar === 'ENCERRADOS') return i.situacao_cadastro === 'ENCERRADO';
    if(F.mostrar === 'ATIVOS') return (i.situacao_cadastro !== 'ENCERRADO' || temPag) && (temPrev || temPag || (i.nes_vinculadas || []).length);
    return true;
  });
  var tot = {prev: 0, liq: 0, inf: 0, aj: 0, def: 0, saldo: 0};
  var linhas = lst.map(function(i){
    var c = calc(i);
    tot.prev += c.previsaoAno; tot.liq += c.liqAno; tot.inf += c.informado; tot.aj += Math.abs(c.ajustar) > 1 ? c.ajustar : 0; tot.saldo += c.saldo; if(c.deficit < 0) tot.def += c.deficit;
    if(F.corrigir === 'AJUSTAR' && Math.abs(c.ajustar) <= 1) return '';
    if(F.corrigir === 'DEFICIT' && c.deficit >= 0) return '';
    var meses = D.competencias.map(function(m){
      var pm = c.porMes[m], cls, txt;
      if(pm && F.rec){ var sub = c.pags.filter(function(p){ return p.competencia === m && p.recurso === F.rec && /INFORMADO|CONFIRMADO|AJUSTAR/.test(p.situacao); }); var v = sub.reduce(function(a, p){ return a + num(p.valor); }, 0); return '<td class="m' + (v ? ' c-' + sub[0].situacao : ' prev') + '">' + (v ? brlc(v) : (c.prev[m] ? brlc(c.prev[m]) : '')) + '</td>'; }
      if(pm && pm.v){ cls = 'c-' + (pm.st === 'DISTRIBUIDO' || pm.st === 'SALDO_OK' || pm.st === 'REFORCO' ? 'INFORMADO' : pm.st); txt = brlc(pm.v); }
      else if(pm && pm.aberto){ cls = 'c-ABERTO'; txt = brlc(pm.aberto); }
      else { cls = 'prev'; txt = c.prev[m] ? brlc(c.prev[m]) : ''; }
      return '<td class="m ' + cls + '" title="' + comp(m) + ' · previsto ' + brl(c.prev[m] || 0) + '">' + txt + '</td>';
    }).join('');
    return '<tr class="click" data-ficha="' + esc(i.id) + '"><td><b>' + esc(i.ug) + '</b> ' + esc(i.sigla || '') + '<span class="s">' + esc(i.orcamento || '') + '</span></td><td>' + esc(i.processo_raiz) + '<span class="s">' + esc(i.formalizacao) + '</span></td><td>' + esc(i.favorecido) + '</td><td>' + esc(i.numero || i.instrumento || '—') + '</td>' +
      '<td class="m' + (Math.abs(c.ajustar) > 1 ? ' c-AJUSTAR' : '') + '">' + (Math.abs(c.ajustar) > 1 ? brlc(c.ajustar) : '—') + '</td>' + meses + '<td class="def' + (c.deficit >= 0 ? ' ok' : '') + '">' + brlc(c.deficit) + '</td></tr>';
  }).join('');
  var k = function(l, v, sub, cls){ return '<div class="kpi ' + (cls || '') + '"><span>' + l + '</span><b>' + v + '</b><small>' + sub + '</small></div>'; };
  var dir = admin() ? '<div class="acoes"><button class="bt sec" type="button" data-importar title="Contratos, parcerias e TED vigentes gerados pelo robô">Importar vigentes</button><button class="bt" type="button" data-tesouro>Ler Tesouro e conferir</button><button class="bt sec" type="button" data-simular>Simular liquidação (teste)</button></div>' : '';
  var orcs = uniq(D.instrumentos.map(function(i){ return i.orcamento; })), forms = uniq(D.instrumentos.map(function(i){ return i.formalizacao; }));
  return cab('Visão geral do ano ' + D.ano + ' <small style="font-size:16px;color:var(--mudo)">' + lst.length + ' instrumentos</small>', 'Grade de dez/' + String(D.ano - 1).slice(2) + ' a dez/' + String(D.ano).slice(2) + ': o valor informado em cada competência, colorido pela situação. Em cinza, a previsão. Clique na linha para abrir a ficha.', dir) +
    '<div class="kpis">' + k('Previsão do ano', brlc(tot.prev), 'soma das competências') + k('Liquidado no ano', brlc(tot.liq), 'Tesouro, desde a entrada da NE', 'pos') + k('Informado pelos executores', brlc(tot.inf), 'pagamentos lançados') + k('Ajustar', brlc(tot.aj), 'liquidado − informado', Math.abs(tot.aj) > 1 ? 'neg' : '') + k('Saldo de empenho', brlc(tot.saldo), 'EXE + RAP vinculados') + k('Déficit do ano', brlc(tot.def), 'soma dos instrumentos com déficit', tot.def < 0 ? 'neg' : 'pos') + '</div>' +
    '<div class="card"><div class="filtros">' +
      '<label>Orçamento<select class="mini" data-f="orc">' + opts(orcs, F.orc, 'Todos') + '</select></label>' +
      '<label>UG<select class="mini" data-f="ug">' + opts(LISTAS.ug, F.ug, 'Todas') + '</select></label>' +
      '<label>Formalização<select class="mini" data-f="form">' + opts(forms, F.form, 'Todas') + '</select></label>' +
      '<label>Mostrar<select class="mini" data-f="mostrar"><option value="ATIVOS"' + (F.mostrar === 'ATIVOS' ? ' selected' : '') + '>Com previsão, NE ou pagamento</option><option value="TODOS"' + (F.mostrar === 'TODOS' ? ' selected' : '') + '>Todos</option><option value="ENCERRADOS"' + (F.mostrar === 'ENCERRADOS' ? ' selected' : '') + '>Encerrados</option></select></label>' +
      '<label>Corrigir<select class="mini" data-f="corrigir"><option value="TODOS"' + (F.corrigir === 'TODOS' ? ' selected' : '') + '>Mostrar todos</option><option value="AJUSTAR"' + (F.corrigir === 'AJUSTAR' ? ' selected' : '') + '>Com valor a ajustar</option><option value="DEFICIT"' + (F.corrigir === 'DEFICIT' ? ' selected' : '') + '>Só com déficit</option></select></label>' +
      '<div style="display:flex;gap:6px"><button type="button" class="chip' + (!F.rec ? ' on' : '') + '" data-rec="">Todos</button><button type="button" class="chip' + (F.rec === 'EXE001' ? ' on' : '') + '" data-rec="EXE001">EXE</button><button type="button" class="chip' + (F.rec === 'RAP001' ? ' on' : '') + '" data-rec="RAP001">RAP</button></div>' +
    '</div></div>' +
    '<div class="card"><div class="legenda" style="margin-bottom:10px"><span><i style="background:#e3f1da"></i>Confirmado pelo Tesouro</span><span><i style="background:#e3edf7"></i>Informado</span><span><i style="background:#fdf0dc"></i>Demanda em andamento</span><span><i style="background:#fdecea"></i>Ajustar</span><span><i style="background:#eef2ee"></i><em>previsão</em></span></div>' +
    '<div class="rolar" style="max-height:620px;overflow:auto"><table class="grade"><thead><tr><th>UG · Serv/Aqs</th><th>Processo raiz</th><th>Favorecido</th><th>Contrato / instr.</th><th>Ajustar</th>' + D.competencias.map(function(m){ return '<th class="n">' + comp(m) + '</th>'; }).join('') + '<th class="n">Déficit do ano</th></tr></thead><tbody>' + (linhas || '<tr><td colspan="19" class="vazio">Nada com esse filtro.</td></tr>') + '</tbody></table></div></div>';
}
function uniq(a){ var o = {}; a.forEach(function(x){ if(x) o[x] = 1; }); return Object.keys(o).sort(); }

/* ---------- Orçamento: chegada do processo → analista → financeiro ---------- */
var FO = {cnpj: '', contrato: '', entidade: '', instrumento: '', proposta: '', ne: '', ug: ''};
var ORC = {aba: '', comp: '', atras: true, lim: 80, todas: false};
function chefeOrc(){ return D.eu.perfil === 'ADMIN' || D.eu.perfil === 'CHEFE_ORCAMENTO'; }
function nomeOrc(email){ var p = (D.equipeOrc || []).concat(D.equipe).filter(function(x){ return x.email === String(email || '').toLowerCase(); })[0]; return p ? p.nome : (email || '—'); }
function filtroAtivo(){ return Object.keys(FO).some(function(k){ return String(FO[k]).trim(); }); }
function bateFO(i, p){
  var dg = function(x){ return String(x || '').replace(/\D/g, ''); }, tem = function(alvo, q){ q = String(q).trim(); if(!q) return true; var d = dg(q); if(d.length >= 3 && dg(alvo).indexOf(d) >= 0) return true; return norm(q).split(/\s+/).every(function(w){ return norm(alvo).indexOf(w) >= 0; }); };
  if(FO.ug && String(i.ug) !== FO.ug) return false;
  if(!tem(i.cnpj, FO.cnpj)) return false;
  if(!tem(i.numero, FO.contrato)) return false;
  if(!tem(i.favorecido, FO.entidade)) return false;
  if(!tem(i.instrumento, FO.instrumento)) return false;
  if(!tem(i.proposta, FO.proposta)) return false;
  if(String(FO.ne).trim()){ var nes = (i.nes_vinculadas || []).concat(String(i.nes || '').split(/[,;\s]+/), p ? [p.ne] : []).join(' '); if(!tem(nes, FO.ne)) return false; }
  return true;
}

}

    if(i.situacao_cadastro === 'ENCERRADO' || !bateFO(i)) return;
    var c = calc(i), tem = {}; c.pags.forEach(function(p){ tem[p.competencia] = 1; });
    cs.forEach(function(m){ if(c.prev[m] && !tem[m]) out.push({i: i, m: m, v: c.prev[m]}); });

  chamar({acao: 'buscaTesouro', q: q}).then(function(r){ var el = $('tes-res'); if(el) el.innerHTML = r.ok ? resultadoTesouro(r.itens || []) : '<div class="msg erro">' + esc(r.msg) + '</div>'; }).catch(function(){ var el = $('tes-res'); if(el) el.innerHTML = '<div class="msg erro">Falha de conexão.</div>'; });
}
function resultadoTesouro(r){
  if(!r.length) return '<div class="vazio">Nada no Tesouro com isso. Se acabou de colar o link, rode “Ler Tesouro” na Visão geral.</div>';
  return '<div class="res-tes">' + r.map(function(t){ return '<label><input type="checkbox" data-tes-ne="' + esc(t.ne) + '" data-ug="' + esc(t.ug) + '" data-proc="' + esc(t.processo) + '" data-fav="' + esc(t.favorecido) + '" data-nd="' + esc(t.nd) + '"><span><b>' + esc(t.ne) + '</b> · UG ' + esc(t.ug) + ' · ' + esc(t.tipo) + ' · ' + esc(t.processo) + '<span class="s">' + esc(t.favorecido) + ' · ND ' + esc(t.nd) + ' · saldo ' + brl(t.saldo) + '</span></span></label>'; }).join('') + '</div><div class="acoes" style="margin-top:8px"><button class="bt sec peq" type="button" data-tes-usar>Usar as NEs marcadas</button></div>';
}

/* ---------- eventos ---------- */

  if((x = t.closest('[data-chegou-salvar]'))){

    x.disabled = true; ABERTO = null; ORC.aba = oc.analista ? 'mesa' : 'dist'; acao(oc, oc.analista ? 'Processo registrado e entregue ao analista.' : 'Processo registrado. Distribua ao analista.'); return;

  if(t.closest('[data-fo-limpar]')){ Object.keys(FO).forEach(function(k){ FO[k] = ''; }); desenhar(); return; }
  if((x = t.closest('[data-orc-distribuir]'))){
    var its = [].map.call(document.querySelectorAll('select[data-analista]'), function(sl){ return {id: sl.dataset.analista, analista: sl.value}; }).filter(function(it){ var p = D.pagamentos.filter(function(q){ return q.id === it.id; })[0]; return it.analista && p && String(p.analista || '').toLowerCase() !== it.analista; });
    if(!its.length) return aviso('Escolha o analista de pelo menos um processo.', true);
    x.disabled = true; acao({acao: 'distribuirOrc', itens: its}, function(r){ return (r.n || its.length) + ' processo(s) distribuído(s) no orçamento.'; }); return;
  }
  if((x = t.closest('.ne'))){ var f0 = x.closest('form'); [].forEach.call(f0.querySelectorAll('.ne'), function(n){ n.classList.toggle('sel', n === x); }); return; }
  if((x = t.closest('[data-saldo]'))){

    x.disabled = true; ABERTO = null; F.dem = ''; ORC.aba = o.saldoOk ? 'env' : 'refo'; acao(o, o.saldoOk ? 'Saldo confirmado — enviado ao financeiro.' : 'Reforço de NE registrado.'); return;
  }
  if(t.id === 'bt-distribuir'){ var itens = [].map.call(document.querySelectorAll('[data-exec]'), function(s){ return {id: s.dataset.exec, executor: s.value}; }).filter(function(i){ return i.executor; }); if(!itens.length) return aviso('Escolha o executor de pelo menos um item.', true); t.disabled = true; acao({acao: 'distribuir', itens: itens}, function(r){ return r.n + ' item(ns) distribuído(s).'; }); return; }
  if((x = t.closest('[data-pago]'))){ var tr = x.closest('tr'), g = function(n){ return tr.querySelector('[name=' + n + ']').value.trim(); }; var pg = {acao: 'pago', id: x.dataset.pago, processo: g('processo'), competencia: g('competencia'), valor: num(g('valor')), recurso: g('recurso'), obs: g('obs')}; if(!pg.processo) return aviso('Informe o processo SEI do pagamento.', true); if(!(pg.valor > 0)) return aviso('Informe o valor liquidado bruto.', true); x.disabled = true; acao(pg, 'Pagamento informado. A contraprova com o Tesouro confirma depois.'); return; }

    var fi = $('f-inst'), atual = fi.nes.value.split(/[,;\s]+/).filter(Boolean);
    marc.forEach(function(m){ if(atual.indexOf(m.dataset.tesNe) < 0) atual.push(m.dataset.tesNe); });

    var m0 = marc[0].dataset; if(!fi.ug.value) fi.ug.value = m0.ug; if(!fi.processo_raiz.value) fi.processo_raiz.value = m0.proc; if(!fi.favorecido.value) fi.favorecido.value = m0.fav.replace(/^\d{11,14}\s*/, ''); if(!fi.cnpj.value){ var mc = m0.fav.match(/^(\d{14})/); if(mc) fi.cnpj.value = mc[1].replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5'); } if(!fi.natureza.value) fi.natureza.value = m0.nd;

$('tela').addEventListener('change', function(e){
  var t = e.target;
  if(t.dataset.f){ F[t.dataset.f] = t.value; desenhar(); }
  if(t.id === 'fila-todas'){ FILA_TODAS = t.checked; desenhar(); }
  if(t.id === 'orc-todas'){ ORC.todas = t.checked; desenhar(); }
  if(t.id === 'orc-atras'){ ORC.atras = t.checked; desenhar(); }
  if(t.id === 'orc-comp'){ ORC.comp = t.value; desenhar(); }
  if(t.tagName === 'SELECT' && t.dataset.fo){ FO[t.dataset.fo] = t.value; desenhar(); }
  if(t.closest('form[data-demanda]') && t.name === 'competencia'){ var fm = t.closest('form'), c = calc(inst(fm.dataset.demanda)); if(c.prev[t.value]) fm.valor.value = v2(c.prev[t.value]); }
});
$('tela').addEventListener('input', function(e){
  var t = e.target;
  if(t.tagName === 'INPUT' && t.dataset.fo){ FO[t.dataset.fo] = t.value; var k = t.dataset.fo; clearTimeout(window._bf); window._bf = setTimeout(function(){ desenhar(); var b = document.querySelector('input[data-fo="' + k + '"]'); if(b){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 300); }

  if(t.matches && t.matches('textarea[data-auto]')) autoAltura(t);

$('tela').addEventListener('focusin', function(e){ var t = e.target; if(t.tagName === 'INPUT' && CAMPO_MOEDA.test(t.name)) t.inputMode = 'numeric'; });
$('tela').addEventListener('keydown', function(e){ if(e.target.id === 'tes-busca' && e.key === 'Enter'){ e.preventDefault(); buscarTesouro(e.target.value); } });
