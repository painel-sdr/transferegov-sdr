<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual do Painel SDR 2026</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#0d2416;background-image:radial-gradient(ellipse at 50% 35%,#24543a 0%,#0d2416 70%);color:#d9f0df;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:10px;padding:12px 22px}.topo .t{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#9fc7ab;font-weight:700}.topo b{color:#fff;letter-spacing:0;text-transform:none;font-size:15px;margin-left:8px}.sp{flex:1}
.bt{background:transparent;border:1px solid rgba(217,240,223,.35);color:#eaf6ee;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}.bt:hover{background:rgba(255,255,255,.1)}
.palco{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.livro{--h:min(calc(100vh - 130px),980px);--w:calc(var(--h)*.7071);position:relative;width:calc(var(--w)*2);height:var(--h);perspective:3000px;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.livro.fechado{transform:translateX(calc(var(--w)*-.5))}.livro.fim{transform:translateX(calc(var(--w)*.5))}
.folha{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.45,.05,.2,1)}.folha.virada{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f4f8f2;overflow:hidden}
.face img{width:100%;height:100%;display:block;object-fit:contain;background:#fff}
.face.frente{border-radius:2px 8px 8px 2px;box-shadow:12px 14px 34px rgba(0,0,0,.45)}
.face.frente:after{content:"";position:absolute;inset:0 auto 0 0;width:9%;background:linear-gradient(90deg,rgba(0,0,0,.22),transparent);pointer-events:none}
.face.verso{transform:rotateY(180deg);border-radius:8px 2px 2px 8px;box-shadow:-12px 14px 34px rgba(0,0,0,.45)}
.face.verso:after{content:"";position:absolute;inset:0 0 0 auto;width:9%;background:linear-gradient(270deg,rgba(0,0,0,.22),transparent);pointer-events:none}
.contra{background:#0f3a22;display:flex;align-items:center;justify-content:center;text-align:center;color:#cfe6d6;font-size:14px;line-height:1.6}.contra b{color:#fff;font-size:18px;letter-spacing:.2em}
.zona{position:absolute;top:0;bottom:0;width:22%;z-index:900;cursor:pointer}.zona.e{left:0}.zona.d{right:0}
.nav{display:flex;justify-content:center;align-items:center;gap:14px;padding:10px 0 16px;font-size:13px;color:#9fc7ab}
.nav .bt{padding:7px 12px}.pont{display:flex;gap:5px}.pont i{width:7px;height:7px;border-radius:50%;background:rgba(217,240,223,.25);cursor:pointer}.pont i.on{background:#f2c14e;width:18px;border-radius:4px}
@media (max-width:820px){.livro{--h:min(calc(100vh - 140px),calc(92vw*1.5));--w:calc(var(--h)*.7071);width:var(--w)}.livro.fechado,.livro.fim{transform:none}.folha{left:0;width:100%}.topo .t{display:none}}
</style></head><body>
<div class="topo"><span class="t">Ajuda ·<b>Manual do Painel SDR 2026</b></span><span class="sp"></span>
<button class="bt" onclick="ir(1)">Início</button><button class="bt" onclick="tela()">Tela cheia</button><button class="bt" onclick="pdf()">Baixar PDF</button></div>
<div class="palco"><div class="livro fechado" id="livro"><div class="zona e" onclick="ant()"></div><div class="zona d" onclick="prox()"></div>
<div class="folha"><div class="face frente"><img src="manual/p-01.jpg" alt="página 1"></div><div class="face verso"><img src="manual/p-02.jpg" alt="página 2"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-03.jpg" alt="página 3"></div><div class="face verso"><img src="manual/p-04.jpg" alt="página 4"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-05.jpg" alt="página 5"></div><div class="face verso"><img src="manual/p-06.jpg" alt="página 6"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-07.jpg" alt="página 7"></div><div class="face verso"><img src="manual/p-08.jpg" alt="página 8"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-09.jpg" alt="página 9"></div><div class="face verso"><img src="manual/p-10.jpg" alt="página 10"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-11.jpg" alt="página 11"></div><div class="face verso"><img src="manual/p-12.jpg" alt="página 12"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-13.jpg" alt="página 13"></div><div class="face verso"><img src="manual/p-14.jpg" alt="página 14"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-15.jpg" alt="página 15"></div><div class="face verso"><img src="manual/p-16.jpg" alt="página 16"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-17.jpg" alt="página 17"></div><div class="face verso"><img src="manual/p-18.jpg" alt="página 18"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-19.jpg" alt="página 19"></div><div class="face verso"><img src="manual/p-20.jpg" alt="página 20"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-21.jpg" alt="página 21"></div><div class="face verso"><img src="manual/p-22.jpg" alt="página 22"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-23.jpg" alt="página 23"></div><div class="face verso"><img src="manual/p-24.jpg" alt="página 24"></div></div>
<div class="folha"><div class="face frente"><img src="manual/p-25.jpg" alt="página 25"></div><div class="face verso contra"><div class="selo">Secretaria de Desenvolvimento Rural<br><b>MAPA</b></div></div></div>
</div></div>
<div class="nav"><button class="bt" onclick="ant()" aria-label="Página anterior"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="pont" id="pont"></div><span id="pag"></span><button class="bt" onclick="prox()" aria-label="Próxima página"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
<script>
const L=document.getElementById('livro'),F=[...document.querySelectorAll('.folha')],N=25;let pos=0;
const P=document.getElementById('pont');for(let i=0;i<=F.length;i++){const d=document.createElement('i');d.onclick=()=>ir(i);P.appendChild(d)}
function desenha(){F.forEach((f,i)=>{const v=i<pos;f.classList.toggle('virada',v);f.style.zIndex=v?i+1:F.length-i});L.classList.toggle('fechado',pos===0);L.classList.toggle('fim',pos===F.length);
[...P.children].forEach((d,i)=>d.classList.toggle('on',i===pos));const a=pos*2,b=pos*2+1;document.getElementById('pag').textContent=pos===0?'capa':pos===F.length?'fim':'páginas '+a+'–'+Math.min(b,N);}
function prox(){if(pos<F.length){pos++;desenha()}}function ant(){if(pos>0){pos--;desenha()}}function ir(n){pos=Math.max(0,Math.min(F.length,n));desenha()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')prox();if(e.key==='ArrowLeft')ant();if(e.key==='Home')ir(0)});
let x0=null;L.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});L.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)(d<0?prox:ant)();x0=null});
function tela(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
function pdf(){const l=document.createElement('a');l.href='manual/Manual_Painel_SDR_2026.pdf';l.download='Manual_Painel_SDR_2026.pdf';document.body.appendChild(l);l.click();l.remove()}
desenha();
</script></body></html>
